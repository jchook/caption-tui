name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Node as well as Bun: `bun run test:node` runs the suite under
      # `node --test`, and Node is what the published binary runs on.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run check:ci
      - run: bun test
      - run: bun run test:node
      - run: bun run build

      # The thing users actually get. Packing and running it catches what the
      # test suite cannot: a file missing from `files`, a broken shebang, or a
      # dependency that only resolved because it was a devDependency. Packed
      # with npm, because npm is what publishes it.
      - name: Install the packed tarball and run it
        run: |
          tarball="$(npm pack | tail -1)"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$tarball"
          ./node_modules/.bin/caption-tui --help | grep -q 'caption-tui'
