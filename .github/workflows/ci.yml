name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # `pnpm test` runs the suite under Bun; `pnpm test:node` runs the same
      # files under node --test. Both matter: Bun is the development runtime,
      # Node is what ships.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:ci
      - run: pnpm test
      - run: pnpm test:node
      - run: pnpm build

      # The thing users actually get. Packing and running it catches what the
      # test suite cannot: a file missing from `files`, a broken shebang, a
      # dependency that only resolved because it was a devDependency.
      - name: Install the packed tarball and run it
        run: |
          tarball="$(pnpm pack | tail -1)"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$tarball"
          ./node_modules/.bin/caption-tui --help | grep -q 'caption-tui'
